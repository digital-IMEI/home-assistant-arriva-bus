name: Validate and release Arriva Bus

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install 'homeassistant==2026.8.2' 'pyzmq==27.2.0' pytest pytest-asyncio ruff pyproj==3.8.0
      - run: |
          python -m compileall -q custom_components
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Publish regular release and installation archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version=$(python -c 'import json; print(json.load(open("custom_components/arriva_bus/manifest.json"))["version"])')
          release_tag="v${release_version}"
          if gh release view "$release_tag" >/dev/null 2>&1; then exit 0; fi
          cd custom_components
          zip -r ../arriva_bus.zip arriva_bus -x '*/__pycache__/*' '*.pyc'
          cd ..
          gh release create "$release_tag" arriva_bus.zip --target "$GITHUB_SHA" --title "Arriva Bus ${release_version}" --notes-file ARRIVA_RELEASE.md --latest
