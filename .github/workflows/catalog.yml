name: Refresh compact Arriva catalogue

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arriva-catalogue
  cancel-in-progress: false

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install builder dependency (not installed in HA)
        run: python -m pip install 'pyproj==3.8.0'
      - name: Download and reduce current GTFS and CHB
        run: python scripts/build_arriva_catalog.py
      - name: Guard catalogue coverage before publishing
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          path = Path('custom_components/arriva_bus/data/catalog.json.gz')
          data = json.loads(gzip.decompress(path.read_bytes()))
          assert data['schema'] == 1
          assert len(data['lines']) >= 100 and len(data['stops']) >= 1000
          coverage = data['coverage']
          assert coverage['mapped_gtfs_stops'] / coverage['gtfs_stops'] >= 0.75
          assert path.stat().st_size < 2_000_000
          for line in data['lines']:
              for direction in line['directions']:
                  assert all(code in data['stops'] for code in direction['stops'])
          PY
      - name: Publish catalogue to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/arriva_bus/data/catalog.json.gz
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh compact Arriva GTFS catalogue [skip ci]'
          git push origin HEAD:main
